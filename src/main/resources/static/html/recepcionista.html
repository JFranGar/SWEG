<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recepción - SWGEC</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .section-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .section-bar h3 { font-size:13px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.6px; margin:0; }
    .btn-sm { padding:6px 12px; font-size:12px; }
    .reserva-card { background:var(--bg-panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
    .reserva-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .reserva-card-sala { font-weight:700; font-size:14px; }
    .reserva-card-info { font-size:12px; color:var(--text-muted); margin-bottom:8px; }
    .reserva-card-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .en-uso-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; }
    dialog { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); margin:0; max-height:92vh; overflow-y:auto;
      background:var(--bg-panel); border:1px solid var(--border-soft); border-radius:var(--radius); padding:0;
      width:min(400px,92vw); color:var(--text-primary); }
    dialog::backdrop { background:rgba(0,0,0,0.72); backdrop-filter:blur(3px); }
    .modal-inner { padding:24px; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .modal-title { font-weight:700; color:var(--gold); font-size:15px; }
    .btn-close { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:22px; line-height:1; padding:2px 6px; border-radius:4px; }
    .modal-footer { display:flex; gap:8px; margin-top:16px; justify-content:center; }
    .limpieza-toggle { display:flex; align-items:center; gap:10px; padding:12px; background:rgba(255,255,255,0.03); border-radius:8px; border:1px solid var(--border-subtle); margin:12px 0; }
    .limpieza-toggle label { font-size:13px; color:var(--text-primary); cursor:pointer; flex:1; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-dot"></div><div class="brand-text">SWGEC</div></div>
      <nav class="nav">
        <a id="nav-buscar" class="active" href="#">Buscar Reserva</a>
        <a id="nav-en-uso" href="#">Salas en Uso</a>
      </nav>
      <div class="sidebar-footer">
        <div id="user-correo" class="user-chip" style="margin-bottom:8px;font-size:11px;word-break:break-all"></div>
        <button id="btn-logout" class="btn btn-secondary full">Cerrar sesión</button>
      </div>
    </aside>
    <main class="main container">
      <div class="main-header"><h2 id="main-title">Buscar Reserva</h2></div>

      <!-- ══ SECCIÓN BUSCAR ══ -->
      <div id="section-buscar">
        <div class="card" style="max-width:720px">
          <div class="card-title">Buscar Reserva por correo</div>
          <form id="buscar-form" style="display:flex;gap:8px;align-items:center">
            <input id="correo-cliente" type="email" placeholder="cliente@swgec.ec" class="input" style="flex:1">
            <button class="btn btn-primary" type="submit">Buscar</button>
          </form>
          <div id="resultados" style="margin-top:12px"></div>
        </div>
      </div>

      <!-- ══ SECCIÓN SALAS EN USO ══ -->
      <div id="section-en-uso" style="display:none">
        <div class="section-bar">
          <h3>Salas actualmente en uso</h3>
          <button id="btn-refresh-uso" class="btn btn-secondary btn-sm">↻ Actualizar</button>
        </div>
        <div id="en-uso-grid" class="en-uso-grid"></div>
      </div>
    </main>
  </div>

  <!-- ══ MODAL SALIDA ══ -->
  <dialog id="modal-salida">
    <div class="modal-inner">
      <div class="modal-header">
        <span class="modal-title">Registrar Salida</span>
        <button type="button" class="btn-close" id="modal-salida-close">×</button>
      </div>
      <div id="modal-salida-info" style="font-size:13px;color:var(--text-muted);margin-bottom:12px"></div>
      <div class="limpieza-toggle">
        <input type="checkbox" id="chk-limpieza" style="width:18px;height:18px;cursor:pointer">
        <label for="chk-limpieza">La sala requiere limpieza antes de la siguiente reserva</label>
      </div>
      <p style="font-size:12px;color:var(--text-muted)">Si activa la limpieza, la sala pasará a estado <strong>En Limpieza</strong> y no podrá ser reservada hasta marcarla disponible.</p>
      <div class="modal-footer">
        <button id="btn-confirmar-salida" class="btn btn-primary">Confirmar Salida</button>
        <button type="button" id="btn-cancelar-salida" class="btn btn-secondary">Cancelar</button>
      </div>
    </div>
  </dialog>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/guards.js"></script>
  <script src="/js/recepcion.js"></script>
</body>
</html>
