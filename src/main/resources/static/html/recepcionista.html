<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recepción - SWGEC</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-dot"></div><div class="brand-text">SWGEC</div></div>
      <nav class="nav"><a class="active" href="#">Recepción</a></nav>
      <div class="sidebar-footer"><button id="btn-logout" class="btn btn-secondary full">Cerrar sesión</button></div>
    </aside>
    <main class="main container">
      <div class="main-header"><h2>Panel Recepción</h2><div id="user-correo" class="user-chip"></div></div>
      <div class="card" style="max-width:720px">
        <div class="card-title">Buscar Reserva por correo</div>
        <form id="buscar-form" style="display:flex;gap:8px;align-items:center">
          <input id="correo-cliente" type="email" placeholder="cliente@swgec.ec" class="input" style="flex:1">
          <button class="btn btn-primary" type="submit">Buscar</button>
        </form>
        <div id="resultados" style="margin-top:12px"></div>
      </div>
    </main>
  </div>
  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/guards.js"></script>
  <script src="/js/recepcion.js"></script>
</body>
</html>
