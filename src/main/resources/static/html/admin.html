<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin - SWGEC</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .section-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .section-bar h3 { font-size:13px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.6px; margin:0; }
    .pagination { display:flex; align-items:center; gap:10px; margin-top:12px; }
    .pagination button { min-width:80px; }
    .page-info { font-size:12px; color:var(--text-muted); }
    .btn-sm { padding:6px 12px; font-size:12px; }

    /* Diálogos — centrado explícito */
    dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      max-height: 92vh;
      overflow-y: auto;
      background: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 0;
      width: min(480px, 92vw);
      color: var(--text-primary);
    }
    dialog::backdrop { background:rgba(0,0,0,0.72); backdrop-filter:blur(3px); }
    .modal-inner { padding:24px; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
    .modal-title { font-weight:700; color:var(--gold); font-size:15px; }
    .btn-close { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:22px; line-height:1; padding:2px 6px; border-radius:4px; }
    .btn-close:hover { color:var(--text-primary); background:rgba(255,255,255,0.05); }

    /* Footer de modales — botones centrados */
    .modal-footer { display:flex; gap:8px; margin-top:18px; justify-content:center; }

    /* Modal éxito */
    #modal-exito-admin { width:min(340px,90vw); }
    .exito-inner-a { padding:36px 32px; text-align:center; display:flex; flex-direction:column; align-items:center; }
    .exito-icono-a { font-size:48px; margin-bottom:14px; color:#00c851; line-height:1; }
    .exito-msg-a   { font-size:15px; font-weight:600; margin-bottom:22px; color:var(--text-primary); line-height:1.4; }

    /* Modal confirmación */
    #modal-confirmar { width:min(380px,90vw); }
    .confirmar-inner  { padding:36px 32px; text-align:center; display:flex; flex-direction:column; align-items:center; }
    .confirmar-icono  { font-size:44px; margin-bottom:14px; color:#ff9800; line-height:1; }
    .confirmar-msg    { font-size:15px; font-weight:600; margin-bottom:24px; color:var(--text-primary); line-height:1.4; }
    .confirmar-footer { display:flex; gap:10px; justify-content:center; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-dot"></div><div class="brand-text">SWGEC</div></div>
      <nav class="nav">
        <a id="nav-salas" class="active" href="#">Gestión de Salas</a>
        <a id="nav-usuarios" href="#">Gestión de Usuarios</a>
      </nav>
      <div class="sidebar-footer">
        <div id="user-rol" class="user-chip" style="margin-bottom:8px;font-size:11px;word-break:break-all"></div>
        <button id="btn-logout" class="btn btn-secondary full">Cerrar sesión</button>
      </div>
    </aside>
    <main class="main container">
      <div class="main-header"><h2 id="main-title">Gestión de Salas</h2></div>

      <!-- ══ SECCIÓN SALAS ══ -->
      <div id="section-salas">
        <div class="section-bar">
          <h3>Salas registradas</h3>
          <button id="btn-nueva-sala" class="btn btn-primary btn-sm">+ Nueva Sala</button>
        </div>
        <div class="card">
          <table class="table">
            <thead><tr><th>Nombre</th><th>Tipo</th><th>Capacidad</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody id="tabla-salas"></tbody>
          </table>
          <div class="pagination">
            <button id="prev-salas" class="btn btn-secondary btn-sm" disabled>‹ Anterior</button>
            <span id="info-salas" class="page-info"></span>
            <button id="next-salas" class="btn btn-secondary btn-sm" disabled>Siguiente ›</button>
          </div>
        </div>
      </div>

      <!-- ══ SECCIÓN USUARIOS ══ -->
      <div id="section-usuarios" style="display:none">
        <div class="section-bar">
          <h3>Usuarios registrados</h3>
          <button id="btn-nuevo-usuario" class="btn btn-primary btn-sm">+ Nuevo Usuario</button>
        </div>
        <div class="card">
          <table class="table">
            <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Último login</th><th>Acciones</th></tr></thead>
            <tbody id="tabla-usuarios"></tbody>
          </table>
          <div class="pagination">
            <button id="prev-usuarios" class="btn btn-secondary btn-sm" disabled>‹ Anterior</button>
            <span id="info-usuarios" class="page-info"></span>
            <button id="next-usuarios" class="btn btn-secondary btn-sm" disabled>Siguiente ›</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ══ MODAL SALA ══ -->
  <dialog id="modal-sala">
    <div class="modal-inner">
      <div class="modal-header">
        <span class="modal-title" id="modal-sala-title">Nueva Sala</span>
        <button type="button" class="btn-close" id="modal-sala-close" aria-label="Cerrar">×</button>
      </div>
      <form id="sala-form">
        <input type="hidden" id="sala-id">
        <div class="field"><label>Nombre</label><input id="nombre" class="input" autocomplete="off"><div id="err-nombre" class="error-msg"></div></div>
        <div class="field"><label>Tipo</label>
          <select id="tipo" class="select">
            <option value="">Seleccione...</option>
            <option value="REUNION">REUNION</option>
            <option value="SEMINARIO">SEMINARIO</option>
            <option value="TRABAJO">TRABAJO</option>
          </select>
          <div id="err-tipo" class="error-msg"></div>
        </div>
        <div class="field"><label>Capacidad máxima</label><input id="capacidad" type="number" min="1" class="input"><div id="err-capacidad" class="error-msg"></div></div>
        <div class="modal-footer">
          <button id="btn-guardar" class="btn btn-primary">Guardar</button>
          <button type="button" id="btn-cancelar-sala" class="btn btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- ══ MODAL USUARIO ══ -->
  <dialog id="modal-usuario">
    <div class="modal-inner">
      <div class="modal-header">
        <span class="modal-title" id="modal-usuario-title">Nuevo Usuario</span>
        <button type="button" class="btn-close" id="modal-usuario-close" aria-label="Cerrar">×</button>
      </div>
      <form id="usuario-form">
        <input type="hidden" id="usuario-id">
        <div class="field"><label>Nombre</label><input id="u-nombre" class="input" autocomplete="off"><div id="err-u-nombre" class="error-msg"></div></div>
        <div class="field"><label>Correo</label><input id="u-correo" type="email" class="input" autocomplete="off"><div id="err-u-correo" class="error-msg"></div></div>
        <div class="field">
          <label>Contraseña <span style="color:var(--text-muted);font-size:11px">(vacío = no cambiar)</span></label>
          <input id="u-contrasena" type="password" class="input" autocomplete="new-password">
          <div id="err-u-contrasena" class="error-msg"></div>
        </div>
        <div class="field"><label>Rol</label>
          <select id="u-rol" class="select">
            <option value="">Seleccione...</option>
            <option value="CLIENTE">CLIENTE</option>
            <option value="RECEPCIONISTA">RECEPCIONISTA</option>
            <option value="ADMIN">ADMIN</option>
          </select>
          <div id="err-u-rol" class="error-msg"></div>
        </div>
        <div class="modal-footer">
          <button id="btn-u-guardar" class="btn btn-primary">Guardar</button>
          <button type="button" id="btn-cancelar-usuario" class="btn btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- ══ MODAL CONFIRMACIÓN ══ -->
  <dialog id="modal-confirmar">
    <div class="confirmar-inner">
      <div class="confirmar-icono">⚠</div>
      <div id="modal-confirmar-msg" class="confirmar-msg">¿Estás seguro de realizar esta acción?</div>
      <div class="confirmar-footer">
        <button id="modal-confirmar-si" class="btn btn-danger">Sí, eliminar</button>
        <button id="modal-confirmar-no" class="btn btn-secondary">Cancelar</button>
      </div>
    </div>
  </dialog>

  <!-- ══ MODAL ÉXITO ADMIN ══ -->
  <dialog id="modal-exito-admin">
    <div class="exito-inner-a">
      <div class="exito-icono-a">✓</div>
      <div id="modal-exito-admin-msg" class="exito-msg-a">Operación realizada correctamente</div>
      <button id="modal-exito-admin-ok" class="btn btn-primary" style="min-width:130px">Aceptar</button>
    </div>
  </dialog>

  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/guards.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
