<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Inicia sesión en SWGEC, el sistema de gestión de espacios de coworking, para administrar salas, reservas y accesos según tu rol.">
  <title>Login - SWGEC</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>body{background:var(--bg-base)}</style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">
        <h1>SWGEC</h1>
        <p>Gestión de Espacios de Coworking — Sprint 1</p>
      </div>
      <form id="login-form" novalidate>
        <div class="field">
          <label id="lbl-rol">Seleccionar rol</label>
          <div class="role-grid" role="radiogroup" aria-labelledby="lbl-rol">
            <div class="role-card" data-rol="ADMIN" role="radio" aria-checked="false" tabindex="0"><span class="role-icon" aria-hidden="true">👑</span>Administrador</div>
            <div class="role-card" data-rol="RECEPCIONISTA" role="radio" aria-checked="false" tabindex="0"><span class="role-icon" aria-hidden="true">🛎️</span>Recepcionista</div>
            <div class="role-card" data-rol="CLIENTE" role="radio" aria-checked="false" tabindex="0"><span class="role-icon" aria-hidden="true">👤</span>Cliente</div>
          </div>
          <input type="hidden" id="rol-seleccionado" name="rolSeleccionado">
          <div id="err-rol" class="error-msg"></div>
        </div>
        <div class="field">
          <label for="correo">Correo</label>
          <input id="correo" class="input" type="email" autocomplete="email">
          <div id="err-correo" class="error-msg"></div>
        </div>
        <div class="field">
          <label for="contrasena">Contraseña</label>
          <input id="contrasena" class="input" type="password" autocomplete="current-password">
          <div id="err-contrasena" class="error-msg"></div>
        </div>
        <button id="btn-login" type="submit" class="btn btn-primary full">Ingresar</button>
      </form>
      <div class="login-footer" style="text-align:center;margin-top:14px">
        ¿No tienes cuenta? <a href="/html/registro.html">Regístrate como cliente</a>
      </div>
      <div class="login-footer">Usuarios demo: admin@swgec.ec / cliente@swgec.ec (contraseña demo)</div>
    </section>
  </main>
  <div id="toast-container"></div>
  <script defer src="/js/api.js"></script>
  <script defer src="/js/auth.js"></script>
</body>
</html>
