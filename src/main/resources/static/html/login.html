<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - SWGEC</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>body{background:var(--bg-base)}</style>
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">
        <h1>SWGEC</h1>
        <p>Gestión de Espacios de Coworking — Sprint 1</p>
      </div>
      <form id="login-form" novalidate>
        <div class="field">
          <label>Seleccionar rol</label>
          <div class="role-grid">
            <div class="role-card" data-rol="ADMIN"><span class="role-icon">👑</span>Administrador</div>
            <div class="role-card" data-rol="RECEPCIONISTA"><span class="role-icon">🛎️</span>Recepcionista</div>
            <div class="role-card" data-rol="CLIENTE"><span class="role-icon">👤</span>Cliente</div>
          </div>
          <input type="hidden" id="rol-seleccionado" name="rolSeleccionado">
          <div id="err-rol" class="error-msg"></div>
        </div>
        <div class="field">
          <label for="correo">Correo</label>
          <input id="correo" class="input" type="email" autocomplete="email">
          <div id="err-correo" class="error-msg"></div>
        </div>
        <div class="field">
          <label for="contrasena">Contraseña</label>
          <input id="contrasena" class="input" type="password" autocomplete="current-password">
          <div id="err-contrasena" class="error-msg"></div>
        </div>
        <button id="btn-login" type="submit" class="btn btn-primary full">Ingresar</button>
      </form>
      <div class="login-footer">Usuarios demo: admin@swgec.ec / cliente@swgec.ec (contraseña demo)</div>
    </section>
  </main>
  <div id="toast-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
