# ====== Aplicacion ======
spring.application.name=swgec
server.port=8080

# ====== PostgreSQL ======
spring.datasource.url=jdbc:postgresql://localhost:5432/swgec_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ====== JPA / Hibernate ======
spring.jpa.hibernate.ddl-auto=update
# show-sql/format_sql apagados: en producción generan mucho log y presión de memoria/CPU.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ====== Optimizacion de recursos (VM Railway 1GB RAM) ======
# HikariCP: un pool pequeño basta para baja concurrencia y reduce memoria/conexiones.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# Tomcat: reducir el numero de hilos disminuye la memoria nativa (stacks) de forma notable.
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=200
server.tomcat.accept-count=50

# ====== Sesion HTTP (ISO 25010 - Seguridad / Confidencialidad) ======
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SWGEC_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# ====== Recursos estaticos / Cache (ISO 25010 - Eficiencia de desempeno) ======
# Cache-Control para recursos estaticos (CSS/JS/HTML). Los dashboards ya usan
# versionado ?v= para invalidar assets; el resto se beneficia de cache de larga vida.
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# ====== Logging ======
# Nivel INFO en producción: menos I/O y menor huella de memoria que DEBUG.
logging.level.org.springframework.web=INFO
logging.level.com.cleancodecrew.sweg=INFO