# ====== Aplicacion ======
spring.application.name=swgec
server.port=8080

# ====== PostgreSQL ======
spring.datasource.url=jdbc:postgresql://localhost:5432/swgec_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ====== JPA / Hibernate ======
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ====== Sesion HTTP (ISO 25010 - Seguridad / Confidencialidad) ======
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SWGEC_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# ====== Recursos estaticos / Cache (ISO 25010 - Eficiencia de desempeno) ======
# Cache-Control para recursos estaticos (CSS/JS/HTML). Los dashboards ya usan
# versionado ?v= para invalidar assets; el resto se beneficia de cache de larga vida.
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# ====== Logging ======
logging.level.org.springframework.web=INFO
logging.level.com.cleancodecrew.sweg=DEBUG